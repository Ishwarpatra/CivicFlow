<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">CivicFlow — Civic intelligence, made human</title>
  <desc id="desc">An editorial charcoal-teal map field with a three-stop civic route and an off-white information panel.</desc>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c2927"/>
      <stop offset="0.58" stop-color="#123b36"/>
      <stop offset="1" stop-color="#185148"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f3e8"/>
      <stop offset="1" stop-color="#eee7d6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#061714" flood-opacity="0.28"/>
    </filter>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#bfd8c8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#field)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <g fill="none" stroke="#dbe5d3" stroke-opacity="0.14" stroke-width="1.4">
    <path d="M-75 128C104 34 209 228 380 117S693 31 843 144"/>
    <path d="M-45 194C126 99 223 294 397 183S686 95 867 213"/>
    <path d="M-77 481C105 389 244 571 426 458S684 383 894 493"/>
    <path d="M-24 548C158 452 276 642 469 529S708 451 930 561"/>
    <circle cx="188" cy="146" r="144"/>
    <circle cx="188" cy="146" r="98"/>
    <circle cx="188" cy="146" r="52"/>
  </g>

  <text x="64" y="72" fill="#dce7d8" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2.8">A FIELD GUIDE FOR CIVIC ACTION</text>
  <line x1="64" y1="92" x2="361" y2="92" stroke="#dce7d8" stroke-opacity="0.42"/>

  <g transform="translate(64 180)">
    <text x="0" y="0" fill="#f5f1e6" font-family="Georgia, serif" font-size="92" font-weight="700" letter-spacing="-4">CivicFlow</text>
    <text x="4" y="53" fill="#dce7d8" font-family="Arial, sans-serif" font-size="26" font-weight="400" letter-spacing="0.2">Civic intelligence, made human</text>
    <text x="4" y="108" fill="#b7d0be" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.1">SOURCE-AWARE BY DESIGN</text>
  </g>

  <g transform="translate(68 425)">
    <path d="M14 23H91C123 23 139 5 170 5H260" fill="none" stroke="#dce7d8" stroke-opacity="0.76" stroke-width="2" stroke-dasharray="2 9"/>
    <circle cx="14" cy="23" r="7" fill="#f1ece0"/>
    <circle cx="170" cy="5" r="8" fill="#d77b48"/>
    <circle cx="260" cy="5" r="7" fill="#f1ece0"/>
    <text x="0" y="66" fill="#dce7d8" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">01 ELIGIBILITY</text>
    <text x="116" y="90" fill="#dce7d8" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">02 POLLING PLACE</text>
    <text x="246" y="66" fill="#dce7d8" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">03 REPRESENTATION</text>
  </g>

  <g transform="translate(775 74)" filter="url(#shadow)">
    <path d="M0 0H438L370 492H0Z" fill="url(#paper)"/>
    <path d="M0 0H438L370 492" fill="none" stroke="#183e38" stroke-opacity="0.2" stroke-width="2"/>
    <text x="50" y="88" fill="#d77b48" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2.8">CIVICFLOW</text>
    <text x="50" y="155" fill="#102e2a" font-family="Georgia, serif" font-size="50" font-weight="700" letter-spacing="-2">One clear</text>
    <text x="50" y="208" fill="#102e2a" font-family="Georgia, serif" font-size="50" font-weight="700" letter-spacing="-2">next step.</text>
    <line x1="50" y1="248" x2="323" y2="248" stroke="#102e2a" stroke-opacity="0.24"/>
    <text x="50" y="302" fill="#102e2a" font-family="Arial, sans-serif" font-size="22" font-weight="600">Source-aware civic guidance</text>
    <text x="50" y="341" fill="#37554f" font-family="Arial, sans-serif" font-size="16">A calm route for eligibility, polling</text>
    <text x="50" y="366" fill="#37554f" font-family="Arial, sans-serif" font-size="16">information, and public representation.</text>
    <g transform="translate(50 418)">
      <circle cx="10" cy="10" r="10" fill="#d77b48"/>
      <path d="M31 10H182" stroke="#173d37" stroke-opacity="0.6" stroke-width="1.5"/>
      <text x="0" y="48" fill="#173d37" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.7">VERIFY BEFORE ACTION</text>
    </g>
  </g>

  <text x="1210" y="600" text-anchor="end" fill="#b7d0be" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2">CIVIC INTELLIGENCE · MADE HUMAN</text>
</svg>
