# Free Render demonstration only: local SQLite and session data are ephemeral.
# Do not represent this service as durable production hosting.
services:
  - type: web
    runtime: docker
    name: civicflow
    branch: main
    region: oregon
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: DB_PATH
        value: /var/lib/civicflow/civicflow.db
      - key: SESSION_DIR
        value: /var/lib/civicflow
      - key: SESSION_DB
        value: sessions.db
      - key: SESSION_SECRET
        generateValue: true
      - key: LOG_LEVEL
        value: info
